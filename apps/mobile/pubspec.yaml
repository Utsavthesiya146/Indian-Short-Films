name: indian_short_films_mobile
description: "Production Android Mobile Application for Indian Short Films Platform - Discover India. Watch Stories."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.6.0
  cached_network_image: ^3.3.1
  video_player: ^2.9.1
  chewie: ^1.8.5
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
